countries: ["US"]

enable:
  retrieve_databundle: true  #  Recommended 'true', for the first run. Otherwise data might be missing.
  retrieve_databundle_sector: true
  retrieve_cost_data: true  # true: retrieves cost data from technology data and saves in resources/costs.csv, false: uses cost data in data/costs.csv
  download_osm_data: true  # If 'true', OpenStreetMap data will be downloaded for the above given countries
  custom_busmap: true

run:
  name: "US_2023_sector" # use this to keep track of runs with different settings
  sector_name: "US_2023_sector"

scenario:
  simpl: ['']
  ll: ['v1']
  clusters: [100]
  opts: [Co2L-3h]
  planning_horizons:
  - 2020
  sopts:
  - "3h"

electricity:
  extendable_carriers:
    Generator: []
    Store: []

  powerplants_filter: (DateOut >= 2023 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn)
  custom_powerplants: replace # "false" use only powerplantmatching (ppm) data, "merge" combines ppm and custom powerplants, "replace" use only custom powerplants

co2:
  limit: 4.633e+9     # base * 1.1 for calibration purposes
  base: 4.413e+9      # power sector emissions US 2023 https://www.iea.org/countries/united-states/emissions
  emission_price: 0. # [currency/tCO2]; active via Ep wildcard

renewable:
  hydro:
    normalization:
      method: eia
    hydro_capital_cost: true

costs:
  year: 2020
  efficiency:
    coal: 0.3195
    oil: 0.3005
    CCGT: 0.4429
    nuclear: 0.3254
    biomass: 0.30
  VOM:
    oil: 100.0

policy_config:
  hydrogen:
    temporal_matching: "no_temporal_matching" # either "hourly", "monthly", "yearly", "no_temporal_matching"
    temporal_matching_carriers: [csp, solar, onwind, offwind-ac, offwind-dc, ror, hydro, nuclear]

demand_data:
  base_year: 2021

custom_data:
  airports: true

sector:
  electricity_distribution_grid: true
  conventional_generation: # generator : carrier
    OCGT: gas
    CCGT: gas
    oil: oil
    coal: coal
    biomass: biomass
  hydrogen:
    production_technologies: ["Alkaline electrolyzer large", "PEM electrolyzer", "SOEC", "SMR"]

  cc: false # Default CC technologies from PyPSA-Earth (not influencing ethanol, ammonia, cement and still carbon capture retrofits
  SMR CC: false

  land_transport_fuel_cell_share:
    AB_2020: 0
  land_transport_electric_share:
    AB_2020: 0.006
  shipping_hydrogen_share:
    AB_2020: 0
